name: Robot Framework tests (ProjectBase)

# Runs the ProjectBase UI suite against a real environment. Requires repository secrets:
#   PROJECTBASE_BASE_URL, PROJECTBASE_USERNAME, PROJECTBASE_PASSWORD
# Automatic runs exclude the 'negative' tag: the invalid-password test makes one failed login per
# run for the configured account, which could trigger an account lockout.
# The OrangeHRM suite (tag 'orangehrm') is excluded: its Excel workbook is not in this repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1-5' # nightly, weekdays 02:00 UTC
  workflow_dispatch:
    inputs:
      include_negative:
        description: Also run negative tests (one failed login for the test account per run)
        type: boolean
        default: false
      tracing:
        description: Record Playwright traces (password redacted after the run, included in the artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time against the shared test account.
  group: robot-projectbase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_ENV: ci
      HEADLESS: 'true'
      BROWSER: chromium
      NAVIGATION_TIMEOUT_MS: '30000'
      BROWSER_TRACING: ${{ github.event.inputs.tracing == 'true' && 'true' || 'false' }}
      ROBOT_EXCLUDE: ${{ github.event.inputs.include_negative == 'true' && 'NONE' || 'negative' }}
      ROBOT_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c requirements-lock.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Compile and type-check TypeScript
        run: |
          npm run build
          npm run typecheck

      - name: Unit tests (TypeScript)
        run: node --test "dist/test/unit/*.test.js"

      - name: Install Chromium for Browser Batteries
        # Browser Batteries bundles the Playwright wrapper and its Node.js, so 'rfbrowser init' is
        # not used. --with-deps installs the Linux system libraries Chromium needs.
        run: rfbrowser install --with-deps chromium

      - name: Configure ProjectBase credentials
        # Secrets are not available to pull requests from forks; fail with a clear message instead
        # of running against nothing.
        env:
          SECRET_BASE_URL: ${{ secrets.PROJECTBASE_BASE_URL }}
          SECRET_USERNAME: ${{ secrets.PROJECTBASE_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.PROJECTBASE_PASSWORD }}
        run: |
          if [ -z "$SECRET_BASE_URL" ] || [ -z "$SECRET_USERNAME" ] || [ -z "$SECRET_PASSWORD" ]; then
            echo "::error::Repository secrets PROJECTBASE_BASE_URL, PROJECTBASE_USERNAME and PROJECTBASE_PASSWORD must be set."
            exit 1
          fi
          echo "::add-mask::$SECRET_PASSWORD"
          {
            echo "BASE_URL=$SECRET_BASE_URL"
            echo "APP_USERNAME=$SECRET_USERNAME"
            echo "APP_PASSWORD=$SECRET_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate configuration
        run: node dist/scripts/checkEnv.js

      - name: Run Robot Framework
        # The orchestrator validates configuration, runs Robot, redacts the password from traces
        # and exits with Robot's return code.
        run: node dist/scripts/runTests.js --exclude "$ROBOT_EXCLUDE" --exclude orangehrm

      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          from robot.api import ExecutionResult
          if not os.path.exists('results/output.xml'):
              print('No Robot Framework output (the run failed before tests started).')
              raise SystemExit
          stats = ExecutionResult('results/output.xml').statistics.total
          print(f"### Robot Framework (ProjectBase): {stats.passed} passed, {stats.failed} failed, {stats.skipped} skipped")
          EOF

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-projectbase-${{ github.run_number }}
          path: results/
          retention-days: 14
          if-no-files-found: warn
